<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment | Blakmixed Entertainment</title>
<link rel="icon" href="logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="brand" href="/"><img src="logo.webp" alt="Blakmixed Entertainment logo"><span>BLAKMIXED<br><small>ENTERTAINMENT</small></span></a>
</header>
<main class="result">
  <div class="resultbox" id="box"><p>Confirming your payment…</p></div>
</main>
<script>
(async () => {
  const box = document.getElementById("box");
  const ref = new URLSearchParams(location.search).get("reference");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const show = (icon, title, msg, extra = "") =>
    box.innerHTML = `<div class="resulticon">${icon}</div><h1>${title}</h1><p>${msg}</p>${extra}<div class="actions" style="justify-content:center"><a class="btn white" href="/">Back to Home</a></div>`;

  if (!ref) return show("⚠️", "No payment found", "We couldn't find a payment reference on this page.");
  try {
    const r = await fetch("/api/verify?reference=" + encodeURIComponent(ref));
    const d = await r.json();
    if (d.status === "success") {
      show("✅", "Payment confirmed", `Thank you, ${esc(d.name)}! A confirmation email is on its way to <b>${esc(d.email)}</b>. Check your spam folder if you don't see it.`,
        `<div class="receipt"><div><span>Event</span><b>${esc(d.event)}</b></div><div><span>Ticket</span><b>${esc(d.ticket)}</b></div><div><span>Amount paid</span><b>₦${Number(d.amount).toLocaleString("en-NG")}</b></div><div><span>Reference</span><b class="refcode">${esc(d.reference)}</b></div></div>`);
    } else if (d.status === "abandoned" || d.status === "failed") {
      show("❌", "Payment not completed", "Your payment didn't go through and you haven't been charged. You can try again.");
    } else {
      show("⚠️", "We couldn't confirm this payment", "If you were debited, please message us on WhatsApp with your payment reference.");
    }
  } catch {
    show("⚠️", "Couldn't check your payment", "Please refresh this page. If the problem continues, message us on WhatsApp.");
  }
})();
</script>
</body>
</html>
